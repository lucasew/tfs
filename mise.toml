[tools]
"github:lucasew/workspaced" = "0.1.6"

[tasks.lint]
run = "workspaced codebase lint"

[tasks.fmt]
run = "workspaced codebase format"

[tasks.install]
depends = ["install:*"]

[tasks."install:dummy"]
run = "echo 'noop install'"

[tasks.test]
depends = ["test:*"]

[tasks."test:make"]
run = "bash build.sh"

[tasks.codegen]
depends = ["codegen:*"]

[tasks."codegen:dummy"]
run = "echo 'noop codegen'"

[tasks.ci]
depends = ["lint", "test"]
